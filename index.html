<style>
  :root{
    --bg: #F7F8FB;
    --surface: #FFFFFF;
    --surface-2: #EEF1F5;
    --line: #E2E6ED;
    --text: #1B2027;
    --text-dim: #5B6472;
    --text-faint: #8B93A1;
    --green: #2FA972;
    --yellow: #C99A1E;
    --red: #D64C49;
    --meolli: #D98B2B;
    --seipet: #3E8F76;
    --bbz: #D66B6B;
    --common: #2E6FB0;
    --radius: 14px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Apple SD Gothic Neo", sans-serif;

  * { box-sizing: border-box; }
  #wigroot{
    background: var(--bg);
    color: var(--text);
    min-height: 100%;
    padding: 20px 16px 40px;
    letter-spacing: -0.01em;

  .num{ font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

  /* ---------- Header ---------- */
  .wig-header{
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    margin-bottom: 22px; flex-wrap: wrap;
  }
  .wig-title-block .eyebrow{
    font-size:11px; letter-spacing:0.16em; text-transform:uppercase;
    color: var(--text-faint); font-weight:600; margin-bottom:4px;
  }
  .wig-title-block h1{ font-size:22px; margin:0; font-weight:800; }
  .wig-title-block .sub{ font-size:12.5px; color:var(--text-dim); margin-top:4px; display:flex; align-items:center; gap:6px; }
  .live-dot{ width:6px; height:6px; border-radius:50%; background:var(--green); flex-shrink:0; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.35; } }
  .sync-flash{ animation: flash .6s ease; }
  @keyframes flash{ 0%{ background: rgba(79,190,138,0.15); } 100%{ background: transparent; } }
  .sync-btn{
    cursor:pointer; color:var(--text-faint); font-size:13px; padding:1px 4px; border-radius:4px;
    transition: color .15s, transform .3s;
  }
  .sync-btn:hover{ color:var(--text); }
  .sync-btn.spinning{ animation: spin .6s linear; color:var(--common); }
  @keyframes spin{ from{ transform: rotate(0deg); } to{ transform: rotate(360deg); } }
  .live-dot.err{ background: var(--red); animation:none; }

  .ring-wrap{ display:flex; align-items:center; gap:14px; }
  .ring-num{ display:flex; flex-direction:column; align-items:flex-end; }
  .ring-num .pct{ font-size:26px; font-weight:800; line-height:1; }
  .ring-num .lbl{ font-size:10.5px; color:var(--text-dim); margin-top:3px; }

  .brand-tile:hover{ transform: translateY(-1px); box-shadow: 0 4px 12px rgba(16,24,40,0.08); }
  .brand-tile.active{ border-color: var(--accent); }
  .brand-tile::before{

  .brand-tile .bname{ font-size:15px; font-weight:800; margin-bottom:2px; display:flex; align-items:center; gap:6px; }
  .brand-tile .btag{ font-size:11px; color:var(--text-dim); line-height:1.4; margin-bottom:12px; min-height:30px; }
  .brand-edit-toggle{

    background:var(--surface); border:1px solid var(--line); color:var(--text); border-radius:8px;
    padding:7px 9px; font-size:12px; font-family:inherit; outline:none; width:100%;

  .be-kpi-item label{ font-size:9.5px; color:var(--text-faint); }
  .be-cancel, .be-submit{ font-size:11.5px; cursor:pointer; padding:3px 6px; }
  .be-cancel{ color:var(--text-faint); }
  .be-cancel:hover{ color:var(--text); }
  .be-submit{ color:var(--accent); font-weight:700; }

  .flap.target{ background: transparent; border:1.5px dashed var(--accent); }
  .flap .flap-val{
    position:absolute; top:-16px; left:0; right:0; text-align:center; font-size:10px; font-weight:700; color:var(--text-dim);
  }
  .flap-labels{ display:flex; gap:6px; margin-bottom:10px; }
  .flap-labels span{ flex:1; text-align:center; font-size:9px; color:var(--text-faint); }

  .milestone-block{ margin-bottom:10px; }
  .milestone-block .m-label{ font-size:11px; color:var(--text-dim); margin-bottom:3px; }
  .milestone-block .m-due{ font-size:10.5px; color:var(--text-faint); }

  .july-block{ border-top:1px dashed var(--line); padding-top:10px; margin-bottom:10px; }
  .july-label{ font-size:9.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-faint); font-weight:700; margin-bottom:6px; }

  .be-section-label{ font-size:10px; color:var(--text-faint); font-weight:700; margin-top:4px; }

  .brand-progress{ margin-top:8px; }
  .brand-progress .bp-top{ display:flex; justify-content:space-between; font-size:10.5px; color:var(--text-dim); margin-bottom:5px; }
  .bp-bar{ height:6px; border-radius:4px; background: var(--surface-2); overflow:hidden; }
  .bp-fill{ height:100%; border-radius:4px; background: var(--accent); transition: width .4s ease; }

  /* ---------- Person filter ---------- */
  .person-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .pill{
    padding:6px 12px; border-radius:999px; border:1px solid var(--line); background: var(--surface);
    font-size:12px; color: var(--text-dim); cursor:pointer; display:flex; align-items:center; gap:6px;
    transition: all .12s;

  .pill:hover{ border-color:#C7CDD6; color:var(--text); }
  .pill.active{ background: var(--text); color:#FFFFFF; border-color: var(--text); font-weight:700; }
  .pill .cnt{ font-size:10.5px; opacity:0.7; }

  /* ---------- Task list ---------- */
  .brand-section{ margin-bottom:26px; }
  .brand-section-head{
    display:flex; align-items:center; gap:8px; margin-bottom:10px; padding-bottom:8px;
    border-bottom:1px solid var(--line);

  .brand-dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); flex-shrink:0; }
  .brand-section-head h2{ font-size:14px; margin:0; font-weight:800; }
  .brand-section-head .count{ font-size:11.5px; color:var(--text-faint); margin-left:auto; }

  .task-row{
    display:flex; align-items:flex-start; gap:12px; padding:11px 10px; border-radius:10px;
    transition: background .12s;
  }
  .task-row:hover{ background: var(--surface); }
  .task-row.done{ opacity:0.5; }
  .chk{
    width:19px; height:19px; border-radius:6px; border:1.5px solid var(--line);
    flex-shrink:0; margin-top:2px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    background: var(--surface); transition: all .12s;
  }
  .chk.checked{ background: var(--accent); border-color: var(--accent); }
  .chk svg{ width:12px; height:12px; opacity:0; transition:opacity .1s; }
  .chk.checked svg{ opacity:1; }

  .task-main{ flex:1; min-width:0; }
  .task-title{ font-size:13.5px; font-weight:600; line-height:1.4; }

  .task-detail{ font-size:11.5px; color: var(--text-dim); margin-top:3px; line-height:1.4; }
  .task-meta{ display:flex; gap:6px; margin-top:7px; flex-wrap:wrap; }
  .chip{ font-size:10px; padding:2.5px 8px; border-radius:999px; border:1px solid var(--line); color:var(--text-dim); }

  .add-btn{

  .add-btn:hover{ background: rgba(255,255,255,0.06); }
  .add-form{
    display:flex; flex-direction:column; gap:7px; background:var(--surface); border:1px solid var(--line);

  }
  .add-form input{
    background:var(--surface-2); border:1px solid var(--line); color:var(--text); border-radius:8px;

  .add-form input.af-due{ color-scheme: light; }
  .af-actions{ display:flex; justify-content:flex-end; gap:14px; margin-top:2px; }
  .af-cancel, .af-submit{ font-size:12px; cursor:pointer; padding:4px 6px; }
  .af-cancel{ color:var(--text-faint); }
  .af-cancel:hover{ color:var(--text); }
  .af-submit{ color:var(--accent); font-weight:700; }

  .del-btn{
    font-size:16px; line-height:1; color:var(--text-faint); cursor:pointer; padding:2px 6px;
    border-radius:6px; flex-shrink:0; opacity:0; transition: opacity .12s, color .12s;
  }
  .task-row:hover .del-btn{ opacity:1; }
  .del-btn:hover{ color:var(--red); background: rgba(232,96,93,0.1); }

  .edit-btn{
    font-size:13px; line-height:1; color:var(--text-faint); cursor:pointer; padding:4px 6px;
    border-radius:6px; flex-shrink:0; opacity:0; transition: opacity .12s, color .12s;
  }
  .task-row:hover .edit-btn{ opacity:1; }
  .edit-btn:hover{ color:var(--common); background: rgba(46,111,176,0.1); }

  .task-row.editing{ padding:0; }
  .edit-form{
    display:flex; flex-direction:column; gap:7px; background:var(--surface); border:1px solid var(--accent, var(--line));
    border-radius:10px; padding:12px; margin:4px 0; width:100%; box-shadow: 0 1px 3px rgba(16,24,40,0.06);
  }
  .edit-form input{
    background:var(--surface-2); border:1px solid var(--line); color:var(--text); border-radius:8px;
    padding:8px 10px; font-size:12.5px; font-family:inherit; outline:none;
  }
  .edit-form input:focus{ border-color:var(--common); }
  .ef-cancel, .ef-submit{ font-size:12px; cursor:pointer; padding:4px 6px; }
  .ef-cancel{ color:var(--text-faint); }
  .ef-cancel:hover{ color:var(--text); }
  .ef-submit{ color:var(--common); font-weight:700; }

  .empty-note{ font-size:12px; color:var(--text-faint); padding:20px 10px; text-align:center; }

  @media (max-width:520px){
    .wig-header{ flex-direction:column; align-items:flex-start; }
    .ring-wrap{ align-self:flex-start; }
  }
</style>

    authDomain: "q3-wig-dashboard.firebaseapp.com",
    databaseURL: "https://q3-wig-dashboard-default-rtdb.firebaseio.com",
    projectId: "q3-wig-dashboard"
  };
  const FIREBASE_CONFIGURED = FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey !== 'YOUR_API_KEY' && FIREBASE_CONFIG.databaseURL !== 'YOUR_DATABASE_URL';

  let backend = 'none'; // 'firebase' | 'claude' | 'none'
  let fb = null; // { set, stateRef, tasksRef }

  function tasksArrayToObj(arr){
    const o = {};
    arr.forEach(t => { o[t.id] = t; });
    return o;
  }
  function tasksObjToArray(obj){
    return Object.keys(obj).map(k => obj[k]);
  }

  async function initFirebase(){
    if(!FIREBASE_CONFIGURED) return false;
    try{
      const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
      const { getDatabase, ref, onValue, set } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');
      const app = initializeApp(FIREBASE_CONFIG);
      const db = getDatabase(app);
      const stateRef = ref(db, 'wig/state');
      const tasksRef = ref(db, 'wig/tasks');
      const brandsRef = ref(db, 'wig/brands');
      fb = { set, stateRef, tasksRef, brandsRef };

      onValue(tasksRef, (snap) => {
        const val = snap.val();
        if(val === null){
          set(tasksRef, tasksArrayToObj(DEFAULT_TASKS)); // 최초 1회 기본 항목 시딩
          return;
        }
        TASKS = tasksObjToArray(val);
        render();
        setSyncLabel('Firebase 실시간 연결됨 · ' + formatTime(new Date()));
      });

      onValue(stateRef, (snap) => {
        state = snap.val() || {};
        render();
        setSyncLabel('Firebase 실시간 연결됨 · ' + formatTime(new Date()));
      });

      onValue(brandsRef, (snap) => {
        const val = snap.val();
        if(val === null){
          set(brandsRef, DEFAULT_BRANDS); // 최초 1회 기본값 시딩
          return;
        }
        BRANDS = val;
        render();
        setSyncLabel('Firebase 실시간 연결됨 · ' + formatTime(new Date()));
      });

      backend = 'firebase';
      const dot = document.getElementById('liveDot');
      if(dot) dot.classList.remove('err');
      setSyncLabel('Firebase 실시간 연결됨');
      return true;
    }catch(e){
      console.warn('Firebase 연결 실패, 폴백 모드로 전환', e);
      return false;
    }
  }

  async function persistState(){
    if(backend === 'firebase'){
      try{ await fb.set(fb.stateRef, state); }catch(e){ console.error('Firebase 저장 실패', e); }
    } else if(backend === 'claude'){
      await saveState();
    }
  }

  async function persistTasks(){
    if(backend === 'firebase'){
      try{ await fb.set(fb.tasksRef, tasksArrayToObj(TASKS)); }catch(e){ console.error('Firebase 저장 실패', e); }
    } else if(backend === 'claude'){
      await saveTasks();
    }
  }

  async function persistBrands(){
    if(backend === 'firebase'){
      try{ await fb.set(fb.brandsRef, BRANDS); }catch(e){ console.error('Firebase 저장 실패', e); }
    } else if(backend === 'claude'){
      await saveBrands();
    }
  }

  let lastRemote = null; // last known JSON string from storage, to detect external changes

  function formatTime(d){
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0') + ':' + d.getSeconds().toString().padStart(2,'0');
  }

  function setSyncLabel(text){
    const el = document.getElementById('dateSub');
    if(el) el.textContent = text;
  }

  async function loadState(isPoll){
    if(typeof window.storage === 'undefined'){
      document.getElementById('liveDot').classList.add('err');
      setSyncLabel('이 화면에서는 실시간 저장이 지원되지 않아요 (로컬에서만 체크됨)');
      if(!isPoll) render();
      return;
    }
    let raw = '{}';
    try{
      const r = await window.storage.get(STORAGE_KEY, true);
      if(r && typeof r.value === 'string') raw = r.value;
    }catch(e){
      // Key doesn't exist yet (nobody has checked anything off) — this is a normal
      // first-time state, not an error. Treat it as an empty synced state.
      raw = '{}';
    }
    const changed = raw !== lastRemote;
    lastRemote = raw;
    if(changed){
      try{ state = raw ? JSON.parse(raw) : {}; }catch(parseErr){ /* keep current state */ }
      render();
      if(isPoll){
        const tl = document.getElementById('taskLists');
        tl.classList.remove('sync-flash'); void tl.offsetWidth; tl.classList.add('sync-flash');
      }
    }
    setSyncLabel('팀 전체 공유 보드 · 마지막 동기화 ' + formatTime(new Date()));
  }

  async function saveState(){
    try{
      const raw = JSON.stringify(state);
      await window.storage.set(STORAGE_KEY, raw, true);
      lastRemote = raw;
      setSyncLabel('팀 전체 공유 보드 · 마지막 동기화 ' + formatTime(new Date()));
    }
    catch(e){ console.error('저장 실패', e); setSyncLabel('팀 전체 공유 보드 · 저장 실패, 재시도 중'); }
  }

  let lastRemoteTasks = null;

  async function loadTasks(isPoll){
    if(typeof window.storage === 'undefined') return;
    let raw = null;
    try{
      const r = await window.storage.get(TASKS_KEY, true);
      if(r && typeof r.value === 'string') raw = r.value;
    }catch(e){
      raw = null; // key not created yet
    }
    if(raw === null){
      // First time ever: seed shared storage with the default task list.
      if(!isPoll){
        raw = JSON.stringify(DEFAULT_TASKS);
        try{ await window.storage.set(TASKS_KEY, raw, true); }catch(e){ /* will retry on next save */ }
      } else {
        return;
      }
    }
    const changed = raw !== lastRemoteTasks;
    lastRemoteTasks = raw;
    if(changed){
      try{ TASKS = JSON.parse(raw); }catch(parseErr){ /* keep current TASKS */ }
      render();
    }
  }

  async function saveTasks(){
    try{
      const raw = JSON.stringify(TASKS);
      await window.storage.set(TASKS_KEY, raw, true);
      lastRemoteTasks = raw;
      setSyncLabel('팀 전체 공유 보드 · 마지막 동기화 ' + formatTime(new Date()));
    }catch(e){ console.error('항목 저장 실패', e); }
  }

  let lastRemoteBrands = null;

  async function loadBrands(isPoll){
    if(typeof window.storage === 'undefined') return;
    let raw = null;
    try{
      const r = await window.storage.get(BRANDS_KEY, true);
      if(r && typeof r.value === 'string') raw = r.value;
    }catch(e){
      raw = null;
    }
    if(raw === null){
      if(!isPoll){
        raw = JSON.stringify(DEFAULT_BRANDS);
        try{ await window.storage.set(BRANDS_KEY, raw, true); }catch(e){ /* will retry on next save */ }
      } else {
        return;
      }
    }
    const changed = raw !== lastRemoteBrands;
    lastRemoteBrands = raw;
    if(changed){
      try{ BRANDS = JSON.parse(raw); }catch(parseErr){ /* keep current BRANDS */ }
      render();
    }
  }

  async function saveBrands(){
    try{
      const raw = JSON.stringify(BRANDS);
      await window.storage.set(BRANDS_KEY, raw, true);
      lastRemoteBrands = raw;
      setSyncLabel('팀 전체 공유 보드 · 마지막 동기화 ' + formatTime(new Date()));
    }catch(e){ console.error('브랜드 지표 저장 실패', e); }
  }

  function addTask(brand, data){
    const id = 'custom-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    TASKS.push({
      id, brand,
      owner: data.owner.length ? data.owner : ['미배정'],
      title: data.title,
      detail: data.detail || undefined,
      due: data.due || null
    });
    persistTasks();
    render();
  }

  function updateTask(id, data){
    const t = TASKS.find(x => x.id === id);
    if(!t) return;
    t.title = data.title;
    t.owner = data.owner;
    t.due = data.due;
    t.detail = data.detail;
    editingId = null;
    persistTasks();
    render();
  }

  function deleteTask(id){
    TASKS = TASKS.filter(t => t.id !== id);
    delete state[id];
    persistTasks();
    persistState();
    render();
  }

  function startPolling(){
    setInterval(() => { loadState(true); loadTasks(true); loadBrands(true); }, POLL_MS);
    document.addEventListener('visibilitychange', () => {
      if(document.visibilityState === 'visible'){ loadState(true); loadTasks(true); loadBrands(true); }
    });
  }

  function toggle(id){
    state[id] = !state[id];
    persistState();
    render();
  }

  function dueInfo(due){
    if(!due) return {label:'상시', cls:''};
    const d = new Date(due + 'T00:00:00');
    const diff = Math.round((d - TODAY) / 86400000);
    const label = due.slice(5).replace('-','/') + ' 까지';
    if(diff < 0) return {label: label + ' (지연)', cls:'due-overdue'};
    if(diff <= 7) return {label, cls:'due-soon'};
    return {label, cls:''};
  }

  function brandStats(brandKey){
    const ts = TASKS.filter(t => t.brand === brandKey);
    const done = ts.filter(t => state[t.id]).length;
    return {total: ts.length, done, pct: ts.length ? Math.round(done/ts.length*100) : 0};
  }

  function overallStats(){
    const done = TASKS.filter(t => state[t.id]).length;
    return {total: TASKS.length, done, pct: TASKS.length ? Math.round(done/TASKS.length*100) : 0};
  }

  function personCounts(){
    const map = {};
    TASKS.forEach(t => t.owner.forEach(o => {
      if(!map[o]) map[o] = {total:0, done:0};
      map[o].total++;
      if(state[t.id]) map[o].done++;
    }));
    return map;
  }

  function flapChart(kpi){
    const max = Math.max(...kpi.bars.map(b=>b.value), 0.0001);
    const barsHtml = kpi.bars.map(b => {
      const h = Math.max(6, Math.round((b.value/max)*52));
      const valStr = kpi.type === 'percent' ? b.value.toFixed(2)+'%' : b.value + (kpi.unit||'');
      return `<div class="flap ${b.target?'target':''}" style="height:${h}px"><span class="flap-val">${valStr}</span></div>`;
    }).join('');
    const labelsHtml = kpi.bars.map(b => `<span>${b.label}</span>`).join('');
    return `<div class="flap-row">${barsHtml}</div><div class="flap-labels">${labelsHtml}</div>`;
  }

          midInputs = `

        let julyInputs = '';

          </div>

    grid.innerHTML = html;
    grid.querySelectorAll('.brand-tile').forEach(el => {

        const key = el.dataset.brand;

        render();
      });
    });
    grid.querySelectorAll('.brand-edit-toggle').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const key = el.dataset.editbrand;
        editingBrand = (editingBrand === key) ? null : key;
        render();
      });
    });

        e.stopPropagation();

        const form = document.getElementById('brandedit-' + key);
        const b = BRANDS[key];
        b.tagline = form.querySelector('.be-tagline').value.trim();
        if(b.kpi){
          form.querySelectorAll('.be-kpi-val').forEach(inp => {
            const idx = parseInt(inp.dataset.idx, 10);
            const val = parseFloat(inp.value);
            if(!isNaN(val)) b.kpi.bars[idx].value = val;
          });
        }
        if(b.milestone){
          const label = form.querySelector('.be-mlabel').value.trim();
          const due = form.querySelector('.be-mdue').value;
          if(label) b.milestone.label = label;
          if(due) b.milestone.due = due;
        }
        if(b.julyKpi){
          form.querySelectorAll('.be-jkpi-val').forEach(inp => {
            const idx = parseInt(inp.dataset.idx, 10);
            const val = parseFloat(inp.value);
            if(!isNaN(val)) b.julyKpi.bars[idx].value = val;
          });
        }
        if(b.julyMilestone){
          const jlabel = form.querySelector('.be-jmlabel').value.trim();
          const jdue = form.querySelector('.be-jmdue').value;
          if(jlabel) b.julyMilestone.label = jlabel;

        render();
      });

  function renderPersonRow(){
    const counts = personCounts();
    const row = document.getElementById('personRow');
    const names = Object.keys(counts).sort((a,b) => {
      if(a==='미배정') return 1; if(b==='미배정') return -1;
      return counts[b].total - counts[a].total;
    });
    let html = `<div class="pill ${activePerson==='all'?'active':''}" data-p="all">전체</div>`;
    names.forEach(n => {
      const c = counts[n];
      html += `<div class="pill ${activePerson===n?'active':''}" data-p="${n}">${n} <span class="cnt">${c.done}/${c.total}</span></div>`;
    });
    row.innerHTML = html;
    row.querySelectorAll('.pill').forEach(el => {
      el.addEventListener('click', () => { activePerson = el.dataset.p; render(); });
    });
  }

  function renderTaskLists(){

    brandKeys.forEach(bk => {
      const b = BRANDS[bk];
      let ts = TASKS.filter(t => t.brand === bk);
      if(activePerson !== 'all') ts = ts.filter(t => t.owner.includes(activePerson));

      const doneCount = ts.filter(t => state[t.id]).length;

      html += `<div class="brand-section" style="--accent:${b.hex}">
        <div class="brand-section-head">
          <div class="brand-dot"></div>

        const form = document.getElementById('editform-' + id);
        const title = form.querySelector('.ef-title').value.trim();
        if(!title){ form.querySelector('.ef-title').focus(); return; }
        const owner = form.querySelector('.ef-owner').value.split(',').map(s=>s.trim()).filter(Boolean);
        const due = form.querySelector('.ef-due').value || null;
        const detail = form.querySelector('.ef-detail').value.trim();
        updateTask(id, { title, owner: owner.length ? owner : ['미배정'], due, detail: detail || undefined });
      });
    });
    container.querySelectorAll('.add-btn').forEach(el => {
      el.addEventListener('click', () => {
        const form = document.getElementById('addform-' + el.dataset.addbrand);
        if(form) form.style.display = form.style.display === 'none' ? 'flex' : 'none';
      });
    });
    container.querySelectorAll('.af-cancel').forEach(el => {
      el.addEventListener('click', () => {
        const form = document.getElementById('addform-' + el.dataset.cancelbrand);
        if(form) form.style.display = 'none';
      });
    });
    container.querySelectorAll('.af-submit').forEach(el => {
      el.addEventListener('click', () => {
        const bk = el.dataset.submitbrand;
        const form = document.getElementById('addform-' + bk);
        const title = form.querySelector('.af-title').value.trim();
        if(!title){ form.querySelector('.af-title').focus(); return; }
        const owner = form.querySelector('.af-owner').value.split(',').map(s=>s.trim()).filter(Boolean);
        const due = form.querySelector('.af-due').value || null;
        const detail = form.querySelector('.af-detail').value.trim();
        addTask(bk, { title, owner, due, detail });
      });
    });
  }

  function renderRing(){
    const stats = overallStats();
    const circ = 150.8;
    const offset = circ - (stats.pct/100)*circ;
    document.getElementById('ringFg').style.strokeDashoffset = offset;
    document.getElementById('overallPct').textContent = stats.pct + '%';
  }

  function render(){
    renderBrandGrid();
    renderPersonRow();
    renderTaskLists();
    renderRing();
  }

  (async function boot(){
    const firebaseOk = await initFirebase();
    if(firebaseOk) return; // onValue listeners already render on data arrival

    if(typeof window.storage !== 'undefined'){
      backend = 'claude';
      await loadTasks(false);
      await loadBrands(false);
      await loadState(false);
      startPolling();
    } else {
      backend = 'none';
      const dot = document.getElementById('liveDot');
      if(dot) dot.classList.add('err');
      setSyncLabel('저장 기능 없음 · 이 브라우저에서만 임시로 체크돼요');
      render();
    }
  })();

  document.getElementById('syncBtn').addEventListener('click', () => {
    const btn = document.getElementById('syncBtn');
    btn.classList.add('spinning');
    if(backend === 'claude'){
      Promise.all([loadState(true), loadTasks(true), loadBrands(true)]).finally(() => setTimeout(() => btn.classList.remove('spinning'), 300));
    } else {
      setTimeout(() => btn.classList.remove('spinning'), 300);
    }
  });
})();
</script>
